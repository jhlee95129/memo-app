name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [gateway, auth-service, memo-service, ai-service, web]

    steps:
      - uses: actions/checkout@v4

      - name: Docker build test (${{ matrix.service }})
        run: |
          BUILD_ARGS=""
          if [ "${{ matrix.service }}" = "web" ]; then
            BUILD_ARGS="--build-arg NEXT_PUBLIC_API_URL=http://localhost:3000"
          fi
          docker build --platform linux/amd64 $BUILD_ARGS -f apps/${{ matrix.service }}/Dockerfile .
