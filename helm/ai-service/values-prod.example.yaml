replicaCount: 2

image:
  repository: REGISTRY_PLACEHOLDER/memo-app/ai-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 4003

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "4003"

# Secrets are injected via --set in CD pipeline (GitHub Secrets)
secret:
  REDIS_URL: ""
  ANTHROPIC_API_KEY: ""
