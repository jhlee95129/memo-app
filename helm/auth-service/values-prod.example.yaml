replicaCount: 2

image:
  repository: REGISTRY_PLACEHOLDER/memo-app/auth-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 4001

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  AUTH_SERVICE_HOST: "0.0.0.0"
  AUTH_SERVICE_PORT: "4001"
  POSTGRES_HOST: aws-1-ap-northeast-1.pooler.supabase.com
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres.dzsqbrnwfrofbatvyevb
  POSTGRES_DB: postgres
  TYPEORM_SYNCHRONIZE: "true"
  POSTGRES_SSL: "true"

# Secrets are injected via --set in CD pipeline (GitHub Secrets)
secret:
  POSTGRES_PASSWORD: ""
  JWT_SECRET: ""
  JWT_EXPIRES_IN: 1h
